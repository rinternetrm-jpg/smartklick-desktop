<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    .snap-indicator {
      position: absolute;
      background: rgba(20, 184, 166, 0.15);
      border: 2px solid rgba(20, 184, 166, 0.6);
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
      pointer-events: none;
    }

    .snap-indicator.visible {
      opacity: 1;
    }

    .snap-indicator.pulse {
      animation: snap-glow 0.4s ease-out;
    }

    @keyframes snap-glow {
      0% {
        background: rgba(20, 184, 166, 0.15);
        border-color: rgba(20, 184, 166, 0.6);
        box-shadow: none;
      }
      50% {
        background: rgba(20, 184, 166, 0.35);
        border-color: rgba(20, 184, 166, 1);
        box-shadow: 0 0 30px rgba(20, 184, 166, 0.5),
                    inset 0 0 30px rgba(20, 184, 166, 0.2);
      }
      100% {
        background: rgba(20, 184, 166, 0.25);
        border-color: rgba(20, 184, 166, 0.8);
        box-shadow: none;
      }
    }

    /* Position-spezifische Styles */
    .snap-indicator.top {
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      border-top: none;
      border-left: none;
      border-right: none;
      border-radius: 0 0 12px 12px;
    }

    .snap-indicator.bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      border-bottom: none;
      border-left: none;
      border-right: none;
      border-radius: 12px 12px 0 0;
    }

    .snap-indicator.left {
      top: 0;
      bottom: 0;
      left: 0;
      width: 52px;
      border-top: none;
      border-bottom: none;
      border-left: none;
      border-radius: 0 12px 12px 0;
    }

    .snap-indicator.right {
      top: 0;
      bottom: 0;
      right: 0;
      width: 52px;
      border-top: none;
      border-bottom: none;
      border-right: none;
      border-radius: 12px 0 0 12px;
    }

    /* Innerer Glow-Effekt */
    .snap-indicator::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .snap-indicator.top::after {
      background: linear-gradient(
        to bottom,
        rgba(20, 184, 166, 0.2),
        transparent
      );
    }

    .snap-indicator.left::after {
      background: linear-gradient(
        to right,
        rgba(20, 184, 166, 0.2),
        transparent
      );
    }

    .snap-indicator.right::after {
      background: linear-gradient(
        to left,
        rgba(20, 184, 166, 0.2),
        transparent
      );
    }

    .snap-indicator.bottom::after {
      background: linear-gradient(
        to top,
        rgba(20, 184, 166, 0.2),
        transparent
      );
    }

    /* Text-Label */
    .snap-indicator .label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(20, 184, 166, 0.9);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
    }
  </style>
</head>
<body>
  <div class="snap-indicator top" id="indicator-top">
    <span class="label">Hier andocken</span>
  </div>
  <div class="snap-indicator bottom" id="indicator-bottom">
    <span class="label">Hier andocken</span>
  </div>
  <div class="snap-indicator left" id="indicator-left">
    <span class="label">Hier andocken</span>
  </div>
  <div class="snap-indicator right" id="indicator-right">
    <span class="label">Hier andocken</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const indicators = {
      top: document.getElementById('indicator-top'),
      bottom: document.getElementById('indicator-bottom'),
      left: document.getElementById('indicator-left'),
      right: document.getElementById('indicator-right')
    };

    // Alle Indikatoren verstecken
    function hideAll() {
      Object.values(indicators).forEach(el => {
        el.classList.remove('visible', 'pulse');
      });
    }

    // Indikator anzeigen
    ipcRenderer.on('show-indicator', (event, { edge, intensity }) => {
      hideAll();
      const indicator = indicators[edge];
      if (indicator) {
        indicator.style.opacity = Math.max(0.4, intensity);
        indicator.classList.add('visible');
      }
    });

    // Indikator verstecken
    ipcRenderer.on('hide-indicator', () => {
      hideAll();
    });

    // Pulse-Animation (beim Snappen)
    ipcRenderer.on('pulse-indicator', (event, { edge }) => {
      const indicator = indicators[edge];
      if (indicator) {
        indicator.classList.remove('pulse');
        // Force reflow fuer Animation-Restart
        void indicator.offsetWidth;
        indicator.classList.add('visible', 'pulse');
      }
    });
  </script>
</body>
</html>
